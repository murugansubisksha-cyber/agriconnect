<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriConnect - Customer</title>

    <link rel="stylesheet" href="customer.css">
</head>

<body>

<header>

    <h2>🛒 AgriConnect - Customer Dashboard</h2>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="farmer.html">Farmers</a>
        <a href="quotation.html">Quotation</a>
        <a href="order_tracking.html">Orders</a>
        <a href="ai_result.html">AI Result</a>
        <a href="login.html">Logout</a>
    </nav>

</header>

<section class="container">

    <h1>Available Farm Products</h1>

    <div id="productList" class="product-grid">

        <!-- Products will load here -->

    </div>

</section>

<!-- Order Modal -->

<div id="orderModal" class="modal">

    <div class="modal-content">

        <span class="close" onclick="closeModal()">&times;</span>

        <h2>Place Order</h2>

        <form id="orderForm">

            <input
                type="hidden"
                id="productId"
            >

            <label>Product Name</label>

            <input
                type="text"
                id="productName"
                readonly
            >

            <label>Quantity (Kg)</label>

            <input
                type="number"
                id="quantity"
                min="1"
                required
            >

            <label>Your Offered Price (₹)</label>

            <input
                type="number"
                id="offeredPrice"
                required
            >

            <button type="submit">
                Send Quotation
            </button>

        </form>

    </div>

</div>

<script src="customer.js"></script>

</body>
</html>
