<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriConnect - AI Crop Recommendation</title>

    <link rel="stylesheet" href="ai_result.css">
</head>

<body>

<header>

    <h2>🤖 AgriConnect - AI Crop Recommendation</h2>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="farmer.html">Farmer</a>
        <a href="customer.html">Customer</a>
        <a href="quotation.html">Quotation</a>
        <a href="order_tracking.html">Orders</a>
        <a href="login.html">Logout</a>
    </nav>

</header>

<section class="container">

    <h1>AI Crop Recommendation</h1>

    <form id="predictionForm">

        <label>Soil Type</label>
        <select id="soilType" required>
            <option value="">Select Soil Type</option>
            <option value="Black Soil">Black Soil</option>
            <option value="Red Soil">Red Soil</option>
            <option value="Clay Soil">Clay Soil</option>
            <option value="Sandy Soil">Sandy Soil</option>
            <option value="Loamy Soil">Loamy Soil</option>
        </select>

        <label>Temperature (°C)</label>
        <input
            type="number"
            id="temperature"
            placeholder="Enter temperature"
            required
        >

        <label>Humidity (%)</label>
        <input
            type="number"
            id="humidity"
            placeholder="Enter humidity"
            required
        >

        <label>Rainfall (mm)</label>
        <input
            type="number"
            id="rainfall"
            placeholder="Enter rainfall"
            required
        >

        <button type="submit">
            Predict Crop
        </button>

    </form>

</section>

<section class="container">

    <h2>Prediction Result</h2>

    <div id="resultBox">

        <h3 id="cropName">No Prediction Yet</h3>

        <p id="cropDescription">
            Enter the required values and click
            <b>Predict Crop</b>.
        </p>

    </div>

</section>

<script src="ai_result.js"></script>

</body>
</html>
