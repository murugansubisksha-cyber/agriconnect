<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriConnect - Farmer</title>
    <link rel="stylesheet" href="farmer.css">
</head>

<body>

<header>

    <h2>🌾 AgriConnect - Farmer Dashboard</h2>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="customer.html">Customers</a>
        <a href="quotation.html">Quotations</a>
        <a href="order_tracking.html">Orders</a>
        <a href="ai_result.html">AI Result</a>
        <a href="login.html">Logout</a>
    </nav>

</header>

<section class="container">

    <h1>Add New Product</h1>

    <form id="productForm">

        <input
            type="text"
            id="productName"
            placeholder="Product Name"
            required
        >

        <input
            type="number"
            id="quantity"
            placeholder="Available Quantity (Kg)"
            required
        >

        <input
            type="number"
            id="price"
            placeholder="Price per Kg"
            required
        >

        <input
            type="date"
            id="harvestDate"
            required
        >

        <textarea
            id="description"
            rows="4"
            placeholder="Product Description"
        ></textarea>

        <button type="submit">
            Add Product
        </button>

    </form>

</section>

<section class="container">

    <h1>My Products</h1>

    <table>

        <thead>

        <tr>
            <th>Name</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Harvest Date</th>
            <th>Action</th>
        </tr>

        </thead>

        <tbody id="productTable">

        <!-- Products loaded using JavaScript -->

        </tbody>

    </table>

</section>

<script src="farmer.js"></script>

</body>
</html>
